<script>
const K='ceda_ideahub_v3';let mem=null;
const SECT=['Agribusiness','Renewable energy','ICT and digital','Tourism and hospitality','Manufacturing','Mining services','Health and wellness','Creative industries','Education and skills','Logistics and transport'];
const DIST=['Gaborone','Francistown','Maun','Kasane','Palapye','Selebi-Phikwe','Serowe','Lobatse','Kanye','Ghanzi','Other'];

const today=()=>new Date().toISOString().slice(0,10);

function mk(id,t,own,sec,dist,st,status,sum,extra){return Object.assign({id,title:t,owner:own,sector:sec,district:dist,stage:st,status,v:1,summary:sum,problem:'Small businesses and households lack a dependable, affordable option today.',solution:'A locally run service built around existing community networks.',market:'Initial focus on '+dist+', then national rollout.',team:'Two co-founders and one part-time technician.',jobs:6,funding:'P150,000',created:'2026-09-02',hist:[{d:'2026-09-02',b:own,t:'Idea submitted'}],reviews:[]},extra||{})}
function seed(){const a=mk('I-1001','Cold-chain crates for smallholder farmers','Neo Kgosi','Agribusiness','Francistown','Prototype','approved','Solar-assisted cold crates that keep produce fresh between farm and market.',{amount:150000,hist:[{d:'2026-07-01',b:'Neo Kgosi',t:'Idea submitted'},{d:'2026-07-09',b:'Screening officer',t:'Passed screening'},{d:'2026-07-30',b:'CEDA administrator',t:'Funding approved: P150,000'}],reviews:[{l:'screen',by:'Screening officer',v:1,dec:'pass',c:'Eligible and complete.'},{l:'panel',by:'Dr. Mmusi',v:1,sc:[5,4,4,5,4],c:'Strong impact on post-harvest loss.'}]});
const b=mk('I-1002','Mobile tutoring marketplace for Setswana STEM','Lerato Moeng','Education and skills','Gaborone','Concept','panel','A tutor-matching app delivering low-data lessons in Setswana.',{reviews:[{l:'screen',by:'Screening officer',v:1,dec:'pass',c:'Passed. Please sharpen the revenue model for panel.'}]});
const c=mk('I-1003','Recycled-plastic paving bricks','Tebogo Sesinyi','Manufacturing','Palapye','Concept','revision','Paving bricks made from collected plastic waste for council projects.',{revFrom:1,hist:[{d:'2026-09-02',b:'Tebogo Sesinyi',t:'Idea submitted'},{d:'2026-09-10',b:'Screening officer',t:'Revision requested'}],reviews:[{l:'screen',by:'Screening officer',v:1,dec:'revise',c:'Add a costed pilot plan and evidence of waste supply.'}]});
const d=mk('I-1004','Okavango eco-lodge booking co-op','Kabo Tau','Tourism and hospitality','Maun','Revenue','screening','A shared booking platform for community-owned lodges.');
const e=mk('I-1005','Wallet-to-wallet remittance scheduler','Onkabetse Dube','ICT and digital','Gaborone','Concept','approved','Scheduled micro-remittances for rural families.',{amount:80000,reviews:[{l:'screen',by:'Screening officer',v:1,dec:'pass',c:'OK'},{l:'panel',by:'Dr. Mmusi',v:1,sc:[4,4,3,4,4],c:'Good, needs a licensing plan.'},{l:'panel',by:'Ms. Phiri',v:1,sc:[4,5,4,4,3],c:'Clear demand.'}]});
const f=mk('I-1006','Pay-as-you-go solar for rural clinics','Theo','Renewable energy','Ghanzi','Concept','revision','Metered solar power packages that keep rural clinics running through outages.',{revFrom:1,hist:[{d:'2026-10-20',b:'Theo',t:'Idea submitted'},{d:'2026-10-27',b:'Officer Kgosi',t:'Revision requested'}],reviews:[{l:'screen',by:'Officer Kgosi',v:1,dec:'revise',c:'Add a costed pilot for three clinics and name your technical partner.'}]});const g=mk('I-1007','Community WiFi kiosks for villages','Theo','ICT and digital','Kanye','Concept','draft','Solar-powered kiosks that sell low-cost data and printing in villages.',{hist:[{d:'2026-11-05',b:'Theo',t:'Draft saved'}]});return{user:null,ideas:[a,b,c,d,e,f,g],n:1008}}
function migrate(s){for(const i of s.ideas||[]){if(i.status==='recognised')i.status='approved';delete i.award;delete i.awardReason;if(i.hist)i.hist=i.hist.filter(h=>!/recognis|innovator of the quarter/i.test(h.t||''))}return s}
function load(){try{const s=localStorage.getItem(K);if(s)return migrate(JSON.parse(s))}catch(x){}return mem||seed()}
let S=load();function save(){mem=S;try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}}
const ATTACH_DB='ceda_portal_supporting_files_v1';
function openAttachmentDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('Browser file storage is unavailable.'));return}const req=indexedDB.open(ATTACH_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('files'))req.result.createObjectStore('files')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Could not open browser file storage.'))})}
async function saveSupportingFile(id,file){const db=await openAttachmentDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put({name:file.name,type:file.type,size:file.size,blob:file},id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error||new Error('Could not save supporting file.'))};tx.onabort=()=>{db.close();reject(tx.error||new Error('Could not save supporting file.'))}})}
async function getSupportingFile(id){const db=await openAttachmentDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readonly'),req=tx.objectStore('files').get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error||new Error('Could not read supporting file.'));tx.oncomplete=()=>db.close();tx.onerror=()=>{db.close();reject(tx.error||new Error('Could not read supporting file.'))}})}
const me=()=>S.user,role=()=>S.user&&S.user.role,get=id=>S.ideas.find(i=>i.id===id),owns=i=>!!me()&&(i.ownerEmail?i.ownerEmail.toLowerCase()===(me().email||'').toLowerCase():i.owner===me().name);
const score=i=>{const r=i.reviews.filter(x=>x.l==='panel'&&x.v===i.v);if(!r.length)return null;return Math.round(r.reduce((a,x)=>a+x.sc.reduce((s,v,k)=>s+v/5*CRIT[k][1],0),0)/r.length)};
const chip=s=>`<span class="chip c-${ST[s][1]}">${ST[s][0]}</span>`;
function pipe(i){const m={draft:-1,screening:1,panel:2,revision:i.revFrom||1,approved:3,rejected:3}[i.status];return `<div class="steps">${['Submitted','Screening','Panel','Funding decision'].map((n,k)=>`<div class="${k<=m?'d':''}">${n}</div>`).join('')}</div>`}

function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function opts(a,v){return a.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')}
function card(i,link){return `<a class="card" style="display:block;text-decoration:none;color:inherit;margin:0" href="#idea/${i.id}"><div class="sm mu">${esc(i.sector)} · ${esc(i.district)}</div><h3>${esc(i.title)}</h3><p class="sm">${esc(i.summary)}</p>${chip(i.status)}${score(i)!=null&&role()&&role()!=='citizen'?` <span class="sm mu">Score ${score(i)}/100</span>`:''}</a>`}
function visible(){const r=role();if(r==='admin'||r==='panel'||r==='screener')return S.ideas.filter(i=>i.status!=='draft');return S.ideas.filter(i=>i.status==='approved')}
const need=(r)=>role()&&r.includes(role())?null:`<div class="card"><h2>Sign in required</h2><p>This page is for ${r.map(x=>ROLES[x]).join(' or ').toLowerCase()} accounts.</p><a class="btn" href="#login">Sign in</a></div>`;
const P={};

<h2>How your idea moves to funding</h2><div class="grid">${[['Submit','Describe the problem, solution, market, team and funding need.','submit'],['Screen','An officer checks eligibility and completeness within 10 working days.','screen'],['Evaluate','Panelists score five criteria; the average guides the decision.','evaluate'],['Improve','Get written feedback, revise, and resubmit as many times as needed.','improve'],['Funding decision','Approved ideas receive a recorded funding award from CEDA.','approve']].map((s,k)=>`<a class="card" style="margin:0;display:block;text-decoration:none;color:inherit" href="#${s[2]}"><h3>${k+1}. ${s[0]}</h3><p class="sm mu">${s[1]}</p></a>`).join('')}</div><section class="grid home-extras"><article class="card"><div class="notice-label">From CEDA</div><h2>Updates from CEDA</h2><p class="mu">Funding guidance, application notes and announcements in one place.</p><p><a href="#updates">Read the latest updates →</a></p></article><article class="card"><div class="notice-label">Find your fit</div><h2>Upcoming opportunities</h2><p class="mu">Browse illustrative funding calls and learn what to prepare before applying.</p><p><a href="#opportunities">Explore funding opportunities →</a></p></article></section>`};
P.about=()=>`<h2>Guidelines and criteria</h2><div class="card"><h3>Who can submit</h3><p>Citizens of Botswana, individually or as a team. One idea per submission; edits create a new version.</p></div><div class="card"><h3>Scoring criteria</h3><table><tbody>${CRIT.map(c=>`<tr><td>${c[0]}</td><td>${c[1]}%</td></tr>`).join('')}</tbody></table><p class="sm mu">A weighted average of 70 or more is a recommendation to approve.</p></div><div class="card"><h3>What it takes to launch</h3><ol><li>Have CEDA confirm the funding rules, eligibility, documents, scoring, approval authority and published calls.</li><li>Build a secure server and database for accounts, applications, versions, reviews, decisions and audit history.</li><li>Add verified sign-in, server-enforced staff permissions, email notifications and secure document uploads.</li><li>Deploy in a CEDA-approved environment with encryption, backups, monitoring and recovery procedures.</li><li>Complete privacy and security reviews, then pilot with synthetic data and approved users before accepting real applications.</li></ol><p class="sm mu">The current browser demo stores data on this device only. It is not connected to CEDA systems.</p></div>`;
P.eligibility=()=>`<section class="hero"><div><div class="notice-label">Before you apply</div><h1>Funding eligibility checklist</h1><p>Use this readiness check before starting a funding proposal.</p></div></section><div class="card"><p><b>Illustrative checklist only.</b> CEDA must approve final eligibility, exclusions, required records and programme terms before launch.</p><ul><li>Confirm the applicant and ownership meet the specific funding call requirements.</li><li>Choose the opportunity and sector that match the proposed activity.</li><li>Describe a clear customer or community need and provide supporting evidence.</li><li>Prepare a realistic itemised budget in Botswana pula.</li><li>Explain team capability, local impact and expected jobs.</li><li>Check that the requested documents are current and complete.</li><li>Declare related interests and confirm authority to submit.</li></ul><p><a class="btn" href="#submit">Start a funding proposal</a> <a class="btn alt" href="#opportunities">Browse opportunities</a></p></div>`;P.login=()=>'<section class="hero"><div><div class="notice-label">Your CEDA workspace</div><h1>Sign in or create a profile</h1><p>Use your email to create a local entrepreneur profile for this demo.</p></div></section><div class="grid"><div class="card" style="margin:0"><h2>Sign in with email</h2><form data-f="login"><label for="email">Email address</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com"><p><button class="btn">Continue with email</button></p></form><p class="sm mu">Sign in works for a profile saved in this browser.</p></div><div class="card" style="margin:0"><h2>Create an account</h2><form data-f="reg"><label for="accountName">Full name</label><input id="accountName" name="name" required maxlength="60" autocomplete="name"><label for="accountRole">Account type</label><select id="accountRole" name="role" required><option value="citizen">Entrepreneur</option><option value="screener">CEDA screening officer</option><option value="panel">CEDA evaluation panelist</option><option value="admin">CEDA administrator</option></select><label for="accountEmail">Email address</label><input id="accountEmail" name="email" type="email" required maxlength="254" autocomplete="email" placeholder="you@example.com" oninput="resetEmailVerification()"><button class="btn alt" type="button" onclick="requestEmailVerification()">Send verification code</button><div id="verificationHelp" class="sm mu" role="status" style="margin-top:8px">Enter your email, then request a code.</div><label for="verificationCode">Verification code</label><input id="verificationCode" name="verificationCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="6-digit code"><button class="btn alt" type="button" onclick="verifyEmailCode()">Verify email</button><p><button class="btn">Create demo profile</button></p></form></div></div><div class="card"><h2>Explore with a demo role</h2><p class="sm mu">These accounts use sample data and do not represent real CEDA users.</p><div class="grid">'+DEMO.map((a,i)=>'<article class="card" style="margin:0"><h3>'+ROLES[a.role]+'</h3><p class="sm mu">'+esc(a.name)+' · '+esc(a.email)+'</p><button class="btn alt" data-a="quick" data-i="'+i+'">Enter demo role</button></article>').join('')+'</div></div><p class="sm mu">Local prototype only: profile details stay in this browser. In local-file mode or with ?demo=1, the code is shown on screen and is not emailed. Real delivery requires a configured server and email provider; this is not a verified CEDA account.</p>'
let emailVerificationState=null,verifiedEmail='',verifiedCode='';function resetEmailVerification(){emailVerificationState=null;verifiedEmail='';verifiedCode='';const h=document.getElementById('verificationHelp');if(h)h.textContent=''}async function requestEmailVerification(){const email=(document.getElementById('accountEmail')?.value||'').trim().toLowerCase(),h=document.getElementById('verificationHelp');if(!email||!document.getElementById('accountEmail').checkValidity()){toast('Enter a valid email address first.');return}verifiedEmail='';verifiedCode='';if(location.protocol==='file:'||location.hostname.toLowerCase().endsWith('github.io')||new URLSearchParams(location.search).get('demo')==='1'){const code=String(Math.floor(100000+Math.random()*900000));emailVerificationState={email,code,expires:Date.now()+600000,demo:true};h.innerHTML='Demo code: <b>'+code+'</b>';return}try{const r=await fetch('/api/auth/send-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});if(!r.ok)throw new Error('Email verification service is unavailable.');emailVerificationState={email,expires:Date.now()+600000,demo:false};h.textContent='If this address can receive a code, it should arrive shortly. Enter it below.'}catch(e){h.textContent='Email sending is not configured on this server yet. Please try again later.';toast('Email verification service is unavailable.')}}async function verifyEmailCode(){const email=(document.getElementById('accountEmail')?.value||'').trim().toLowerCase(),code=(document.getElementById('verificationCode')?.value||'').trim(),h=document.getElementById('verificationHelp'),st=emailVerificationState;if(!st||st.email!==email||Date.now()>st.expires){toast('Request a fresh verification code first.');return}if(st.demo){if(code!==st.code){toast('That demo code does not match.');return}verifiedEmail=email;verifiedCode=code;h.textContent='Email verified in this local demo.';return}try{const r=await fetch('/api/auth/verify-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,code})});if(!r.ok)throw new Error('Code could not be verified.');verifiedEmail=email;verifiedCode=code;h.textContent='Email verified.'}catch(e){toast('Code could not be verified. Check the code or request a new one.')}}

return `<p><a href="#repo">Back</a></p><div class="card"><div class="sm mu">${esc(i.sector)} · ${esc(i.district)} · ${esc(i.stage)} · Version ${i.v}</div><h1 style="font-size:2rem">${esc(i.title)}</h1><p>${chip(i.status)} ${i.award?`<span class="chip c-ok">${esc(i.award)}</span>`:''}</p>${pipe(i)}<p>${esc(i.summary)}</p>${T('Problem',i.problem)}${T('Solution',i.solution)}${T('Market',i.market)}${priv?T('Team',i.team)+`<h3>Supporting files</h3>${documentsMarkup(i.documents||[])}`+`<p class="sm mu">By ${esc(i.owner)} · ${esc(i.jobs)} planned jobs · Funding ask ${esc(i.funding)}${i.amount?' · Funding approved P'+Number(i.amount).toLocaleString('en-US'):''}</p>${i.amount?'<p><a class="btn alt" href="#funding">View funding record</a></p>':''}`:''}</div>${act}${priv?`<div class="grid"><div class="card" style="margin:0"><h3>Journey</h3><ul class="tl">${i.hist.map(h=>`<li><b>${esc(h.t)}</b><div class="sm mu">${esc(h.d)} · ${esc(h.b)}</div></li>`).join('')}</ul></div><div class="card" style="margin:0"><h3>Evaluations</h3>${i.reviews.map(x=>`<p class="sm"><b>${esc(x.by)}</b> (${x.l==='panel'?'Panel evaluation':x.l==='screen'?'Screening':'Funding decision'}, v${x.v}${x.sc?', '+Math.round(x.sc.reduce((a,v,k)=>a+v/5*CRIT[k][1],0))+'/100':''})<br>${esc(x.c)}</p>`).join('')||'<p class="sm mu">No evaluations yet.</p>'}</div></div>`:''}`};
const SG={submit:['Submit','Share your idea','Any Botswana citizen can submit. Prepare these before you start:',['A one-sentence summary','The problem and who it affects','Your solution and target market','Your team and expected jobs','The funding you need']],screen:['Screen','Eligibility and completeness check','A screening officer reviews every submission against four checks and responds within 10 working days.',['Citizen-led and eligible','Submission is complete','Fits a CEDA priority sector','No duplicate in the repository']],evaluate:['Evaluate','Panel scoring','Panelists score each idea on five weighted criteria. The average guides the final decision.',CRIT.map(c=>c[0]+' ('+c[1]+'%)')],improve:['Improve','Feedback and resubmission','When an officer or the panel asks for changes, the applicant gets written feedback, edits the idea and resubmits. It returns to the stage that asked for changes, with a new version number.',['Read the feedback on your idea','Edit the idea and address each point','Resubmit as a new version','Follow the new decision under My ideas']],approve:['Funding decision','Funding decision','The administrator reviews panel scores and applicant evidence. A weighted average of 70 or more recommends approval. Approved applications receive a recorded funding amount in Pula.',['Funding amount and funding type are recorded','Loan terms are added when the decision is a loan','The applicant is notified and can track disbursements']]};

P.updates=()=>`<section class="hero"><div><div class="notice-label">CEDA notices</div><h1>Updates from CEDA</h1><p>Guidance and announcements to help applicants prepare and track funding applications.</p></div></section><div class="grid"><article class="card"><span class="chip c-bl">Applicant guidance</span><h2 style="margin-top:10px">Prepare a complete funding application</h2><p>Describe the problem, your proposed solution, target market, team capability, expected jobs and the funding amount requested. Clear evidence helps reviewers assess your proposal.</p><p class="sm mu">Prototype update · Applicant resources</p></article><article class="card"><span class="chip c-wn">Evaluation</span><h2 style="margin-top:10px">Know the review stages</h2><p>Applications move through eligibility screening and independent panel scoring. If CEDA requests changes, review the written feedback and resubmit a new version.</p><p class="sm mu">Prototype update · Funding process</p></article><article class="card"><span class="chip c-ok">Funding decision</span><h2 style="margin-top:10px">Funding awards are recorded in Pula</h2><p>When a proposal is approved, the decision record includes the approved funding amount and appears in the applicant’s idea journey.</p><p class="sm mu">Prototype update · Funding outcomes</p></article></div><p class="sm mu">Demonstration content only. CEDA administrators can publish confirmed notices and dates in a production service.</p>`;P.opportunities=()=>`<section class="hero"><div><div class="notice-label">Funding pathways</div><h1>Opportunities</h1><p>Explore funding areas, prepare your evidence and start a proposal in the pathway that best fits your business.</p></div></section><div class="grid"><article class="card"><span class="chip c-bl">Youth enterprise</span><h2 style="margin-top:10px">Start or grow a youth-led business</h2><p>For youth-led Botswana businesses preparing to launch, strengthen operations or expand into new markets.</p><p><b>Good preparation:</b> ownership and business details, evidence of customer demand, a costed funding request and expected jobs.</p><a class="btn" href="#submit">Start a proposal</a></article><article class="card"><span class="chip c-ok">Green economy</span><h2 style="margin-top:10px">Build a greener enterprise</h2><p>For ventures in renewable energy, resource efficiency, recycling and climate-smart local production.</p><p><b>Good preparation:</b> technical plan, customer evidence, measurable environmental impact and a detailed budget.</p><a class="btn" href="#submit">Start a proposal</a></article><article class="card"><span class="chip c-wn">Local production</span><h2 style="margin-top:10px">Produce locally and add value</h2><p>For Botswana-owned businesses making, processing or delivering products and services locally.</p><p><b>Good preparation:</b> team capability, local supply plan, market evidence and expected employment.</p><a class="btn" href="#submit">Start a proposal</a></article></div><p class="sm mu">Choose the matching sector in your proposal and include the evidence listed for that pathway.</p><p><a class="btn alt" href="#application-centre">Browse CEDA application forms and checklists</a></p>`;P['application-centre']=()=>{const checklists=[['Property Loan Application Checklist','https://www.ceda.co.bw/file/16539/download?token=QvNotWvT','Property funding checklist.','download'],['Services Checklist','https://www.ceda.co.bw/file/16540/download?token=fTGfg9Jk','Checklist for service businesses.','download'],['Agribusiness Checklist','https://www.ceda.co.bw/file/16538/download?token=lIVhxo0B','Requirements for agriculture and agribusiness proposals.','download'],['Trade Finance Checklist','https://www.ceda.co.bw/file/16535/download?token=Pls8Lcac','Checklist for trade-finance applications.','download'],['Manufacturing Checklist','https://www.ceda.co.bw/file/16133/download?token=U2k4AUVY','Manufacturing checklist (Word document).','download'],['Purchase Order Finance Checklist','https://www.ceda.co.bw/file/16536/download?token=XNEwtwD2','Checklist for purchase-order financing.','download'],['External Purchase of Equipment or Machinery','https://www.ceda.co.bw/file/16135/download?token=Nr0CiYV1','Checklist for externally purchased equipment or machinery.','download']];const support=[['COVID-19 Industry Support Facility','#submit','Start an online funding proposal in this portal.','apply'],['CEDA Business Plan Form','https://www.ceda.co.bw/file/16537/download?token=fxXicXVx','Official CEDA business plan form.','download'],['Letlhabile Product Guidelines','https://www.ceda.co.bw/file/16542/download?token=Ku7wwAh3','Official product guidelines.','download'],['Industry Support Facility','#submit','Start an online funding proposal in this portal.','apply'],['Letlhabile Loan Application Form','https://www.ceda.co.bw/file/16561/download?token=cPa_ZpSz','Official application form.','download']];const kyc=[['Business Entities KYC Form','https://www.ceda.co.bw/file/16568/download?token=PT2CRrv5','For business applicants.','download'],['Individual KYC Form','https://www.ceda.co.bw/file/16570/download?token=YHhaG2SZ','For individual applicants.','download'],['Due Diligence Form','https://www.ceda.co.bw/file/16571/download?token=cyweezN0','CEDA due-diligence form.','download']];const products=[['Agriculture',[['Animal Production','Loans and support for livestock farming','https://www.ceda.co.bw/animal-production'],['Crop Production','Financing options for crop cultivation','https://www.ceda.co.bw/crop-production'],['A Di Tsale','Loans and support for artificial insemination','https://www.ceda.co.bw/di-tsale'],['Poultry Financial Suite','Loans and support for the poultry industry','https://www.ceda.co.bw/poultry-financial-suite']]],['Trade Finance',[['Credit Guarantees Scheme','Risk protection for lenders','https://www.ceda.co.bw/credit-guarantees-scheme'],['Guarantees and Bonds','Performance and bid bonds for contracts','https://www.ceda.co.bw/guarantees-and-bonds'],['Short Term Finance','Short-term working capital solutions','https://www.ceda.co.bw/short-term-finance']]],['Structured Finance',[['Equity Funding','Investment options in exchange for equity stakes','https://www.ceda.co.bw/equity-funding'],['Restructures and Business Advisory','Investment and business advisory services','https://www.ceda.co.bw/restructures-business-advisory']]],['Services',[['Retail Operations','Financing for retail and trade businesses','https://www.ceda.co.bw/retail-operations'],['Service Operations','Support for professional and service providers','https://www.ceda.co.bw/service-operations']]],['Property and Manufacturing',[['Manufacturing','Support for industrial and production businesses','https://www.ceda.co.bw/manufacturing'],['Property','Property development and investment funding','https://www.ceda.co.bw/property']]],['Training and Mentoring',[['Mentoring Services','Business guidance from experienced mentors','https://www.ceda.co.bw/mentoring-services-0'],['Training Services','Skills development and entrepreneurship training','https://www.ceda.co.bw/training-services-0']]],['Other programmes',[['Mabogo-Dinku Loan Programme','Support initiative for micro and small enterprises','https://www.ceda.co.bw/products-sectors/mabogo-dinku']]]];const link=x=>'<a class="card resource-link" href="'+x[1]+'" '+(x[3]==='apply'?'':'target="_blank" rel="noopener noreferrer"')+'><b>'+esc(x[0])+'</b><span class="sm mu">'+esc(x[2]||'')+'</span><span class="sm">'+(x[3]==='download'?'Download':x[3]==='apply'?'Apply':'Open CEDA programme details ↗')+'</span></a>';const section=(title,desc,items)=>'<section class="card"><h2>'+title+'</h2><p class="sm mu">'+desc+'</p><div class="grid">'+items.map(link).join('')+'</div></section>';return '<div class="application-centre"><section class="hero"><div><div class="notice-label">Funding application workspace</div><h1>CEDA Application Centre</h1><p>Review the relevant CEDA requirements, download official forms directly, and submit your funding proposal through this portal.</p><p><a class="btn" href="#submit">Apply online now →</a></p></div></section><div class="card app-centre-cta"><h2>Start an online application</h2><p>Create or sign in to an entrepreneur account to prepare a proposal, save a draft, attach supporting documents and track CEDA review feedback.</p><a class="btn" href="#submit">Start application</a></div><div class="card"><h2>Before you apply</h2><p>CEDA describes these checklists as a starting point for sector-specific requirements. Every proposal is unique. The agency recommends consulting your nearest branch for a customised checklist. Direct download links open the CEDA document itself.</p></div>'+section('Industry application checklists','Download the checklist that best matches your funding request.',checklists)+section('Support facility forms and guidelines','Download available forms and guidelines, or start an application in this portal.',support)+section('Know Your Customer and due diligence','Select the form that matches the applicant type.',kyc)+'<section class="card"><h2>CEDA products and services</h2><p class="sm mu">Browse product areas and open CEDA’s programme information for details.</p><div class="grid">'+products.map(([group,items])=>'<article class="card"><h3>'+group+'</h3>'+items.map(x=>'<p><a href="'+x[2]+'" target="_blank" rel="noopener noreferrer"><b>'+esc(x[0])+'</b></a><br><span class="sm mu">'+esc(x[1])+'</span></p>').join('')+'</article>').join('')+'</div></section><p class="sm mu">CEDA may update forms and requirements. Confirm the current checklist and eligibility before submission.</p></div>'};
const WALK=[[0,'Submit an idea','Open Submit, complete the form and select Submit idea. Start a second idea and select Save draft to show drafts. Leave a required field empty to show validation.'],[0,'Improve an idea','Open My ideas. Pay-as-you-go solar for rural clinics carries screening feedback. Select Edit and resubmit, change something and resubmit: it returns to screening as version 2. Also continue the Community WiFi kiosks draft.'],[1,'Screen','Open the Review queue, then an idea. Tick the four eligibility checks and choose Pass to panel, Request revision or Reject. Revision and rejection need written feedback.'],[2,'Evaluate, first panelist','Open Evaluate, then Mobile tutoring marketplace. Score the five weighted criteria and add comments.'],[3,'Evaluate, second panelist','Score the same idea. The average score now shows for the administrator, and each panelist can score a version only once.'],[4,'Decide','Open the same idea. Review the average score and both evaluations, then Approve for funding (enter the amount in Pula), Request revision or Reject with a message to the applicant.'],[4,'Track approved funding','Open Funding tracker to review an approved award and record a demo disbursement reference. This logs a record only and does not initiate a payment.'],[4,'Dashboard','Open Dashboard for totals, jobs from approved ideas, pipeline and sector charts, and the full idea table.'],[0,'Follow the journey','Switch back to the entrepreneur account and open an idea to see the pipeline, journey timeline and evaluations update after each step.'],[null,'Public view and access control','Sign out, then browse Repository (search and filters), the five stage pages and Guidelines. Only approved ideas are visible. As Theo, opening the Review queue asks for a staff account.']];

if(k==='login'){const email=D.email.trim().toLowerCase(),a=(S.accts||[]).find(x=>(x.email||x.e||'').toLowerCase()===email);if(!a){toast('No local profile found. Create one or choose a demo role.');return}signIn(a);return}if(k==='reg'){const email=D.email.trim().toLowerCase(),all=(S.accts||[]);if(!emailVerificationState||emailVerificationState.email!==email||Date.now()>emailVerificationState.expires||verifiedEmail!==email||verifiedCode!==D.verificationCode.trim()){toast('Verify this email before creating the profile.');return}if(all.some(x=>(x.email||x.e||'').toLowerCase()===email)){toast('A local profile already uses this email. Sign in instead.');return}const a={email,name:D.name.trim(),role:D.role||'citizen'};all.push(a);S.accts=all;signIn(a);return}
